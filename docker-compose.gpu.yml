# =============================================================================
# MOSAIC - Docker Compose GPU Override Configuration
# =============================================================================
# This file adds NVIDIA GPU support to the base docker-compose.yml
# Use this for 10-50x faster video processing with GPU acceleration
#
# Prerequisites:
#   1. NVIDIA GPU with CUDA support (compute capability 3.5+)
#   2. NVIDIA drivers installed on host (version 470+)
#   3. NVIDIA Container Toolkit installed
#
# Installation (Ubuntu/Debian):
#   distribution=$(. /etc/os-release;echo $ID$VERSION_ID)
#   curl -s -L https://nvidia.github.io/nvidia-docker/gpgkey | sudo apt-key add -
#   curl -s -L https://nvidia.github.io/nvidia-docker/$distribution/nvidia-docker.list | \
#     sudo tee /etc/apt/sources.list.d/nvidia-docker.list
#   sudo apt-get update && sudo apt-get install -y nvidia-container-toolkit
#   sudo systemctl restart docker
#
# Verification:
#   docker run --rm --gpus all nvidia/cuda:11.8.0-base-ubuntu22.04 nvidia-smi
#
# Usage:
#   docker-compose -f docker-compose.yml -f docker-compose.gpu.yml up -d
#   docker-compose -f docker-compose.yml -f docker-compose.gpu.yml down
#
# Note: Ensure DEVICE=cuda or DEVICE=auto in your .env file
# =============================================================================

version: "3.8"

services:
  # ===========================================================================
  # MCP SERVER - GPU Acceleration Configuration
  # ===========================================================================
  # Only the MCP server needs GPU access for:
  #   - Video frame processing
  #   - Embedding generation (CLIP, Sentence Transformers)
  #   - FAISS vector operations (with faiss-gpu)
  # ===========================================================================
  mcp-server:
    # GPU resource allocation
    deploy:
      resources:
        # Optional: Set resource limits for GPU container
        limits:
          memory: 8G # Increase for larger models
          cpus: "4.0"
        reservations:
          memory: 4G
          cpus: "2.0"
          devices:
            - driver: nvidia # NVIDIA GPU driver
              count: 1 # Number of GPUs (use 'all' for all GPUs)
              capabilities: [gpu] # GPU capabilities required

    # GPU-specific environment variables
    environment:
      # Device configuration: 'cuda' forces GPU, 'auto' auto-detects
      - DEVICE=cuda

      # Specify which GPU(s) to use (0-indexed)
      # Example: '0' for first GPU, '0,1' for first two GPUs, 'all' for all
      - CUDA_VISIBLE_DEVICES=0

      # CUDA memory management
      # - empty: Use all available memory
      # - '0.8': Limit to 80% of GPU memory
      - PYTORCH_CUDA_ALLOC_CONF=max_split_size_mb:512

      # Enable CUDA optimizations
      - CUDA_LAUNCH_BLOCKING=0 # Asynchronous CUDA calls (faster)

      # Optional: CUDNN settings for performance
      - CUDNN_BENCHMARK=1 # Auto-tune CUDNN algorithms

# =============================================================================
# GPU CONFIGURATION NOTES
# =============================================================================
# 1. Multiple GPUs:
#    count: all                            # Use all available GPUs
#    or
#    count: 2                              # Use specific number
#    CUDA_VISIBLE_DEVICES=0,1              # Specify which GPUs
#
# 2. Memory Management:
#    If you encounter OOM (Out of Memory) errors:
#    - Reduce BATCH_SIZE in .env
#    - Set memory limits in deploy.resources.limits
#    - Use gradient checkpointing in models
#
# 3. Monitoring GPU Usage:
#    # From host
#    nvidia-smi
#    watch -n 1 nvidia-smi
#
#    # From container
#    docker exec mosaic-mcp nvidia-smi
#
# 4. Verify GPU is being used:
#    docker exec mosaic-mcp python -c "
#    import torch
#    print(f'CUDA Available: {torch.cuda.is_available()}')
#    print(f'CUDA Device: {torch.cuda.get_device_name(0)}')
#    print(f'CUDA Version: {torch.version.cuda}')
#    "
#
# 5. Performance Tips:
#    - Ensure CUDA version matches PyTorch CUDA version
#    - Use mixed precision (FP16) for faster inference
#    - Enable TensorCore operations where possible
#    - Monitor GPU utilization (should be >70% during processing)
#
# 6. Troubleshooting:
#    Error: "could not select device driver"
#    → sudo systemctl restart docker
#    → Check: docker info | grep -i runtime
#
#    Error: "CUDA out of memory"
#    → Reduce BATCH_SIZE in .env
#    → Set PYTORCH_CUDA_ALLOC_CONF as shown above
#
#    Error: "no cuda-capable device is detected"
#    → Verify: nvidia-smi works on host
#    → Check: CUDA_VISIBLE_DEVICES is set correctly
#    → Ensure: nvidia-container-toolkit is installed
#
# 7. Recommended GPU Configuration by Model Size:
#    Small models (< 1B params):   4-8 GB VRAM (GTX 1080, RTX 3060)
#    Medium models (1-7B params):  8-16 GB VRAM (RTX 3080, RTX 4070)
#    Large models (7B+ params):    16-24 GB VRAM (RTX 3090, RTX 4090)
#    XL models (70B+ params):      40-80 GB VRAM (A100, H100)
#
# =============================================================================
